name: Compilar APK Trabajos QR
on:
  push:
    branches: [main]
    paths: ['vendor/**', 'android/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar interfaz
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp -R vendor android/app/src/main/assets/vendor
      - name: Compilar y revisar
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GRAFIPLOT_QR_Recibos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GRAFIPLOT_QR_Recibos
          path: GRAFIPLOT_QR_Recibos.apk
      - name: Publicar instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-recibos-1.1-${GITHUB_RUN_NUMBER}" GRAFIPLOT_QR_Recibos.apk --title "GRAFIPLOT QR Recibos 1.1" --notes "Android 8 o superior. Requiere Internet y permiso de cámara. Escaneo automático al iniciar sesión; cámara activa mientras la app está visible. Al minimizar o bloquear se detiene. Acceso por correo y contraseña, sin IP. Recibos PDF con selector de destino Android. Instalación independiente."
