name: Compilar APK Trabajos QR
on:
  push:
    branches: [main]
    paths: ['vendor/**', 'android/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validar web y formulario PC
        run: |
          npm install --no-audit --no-fund --prefix /tmp/grafiplot-check @babel/parser@7.26.10
          NODE_PATH=/tmp/grafiplot-check/node_modules node tools/validate-web.cjs
      - name: Preparar interfaz
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp -R vendor android/app/src/main/assets/vendor
          cp service-bridge.html android/app/src/main/assets/service-bridge.html
      - name: Compilar y revisar
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GRAFIPLOT_QR_Deudas_1_6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GRAFIPLOT_QR_Deudas_1_6
          overwrite: true
          path: GRAFIPLOT_QR_Deudas_1_6.apk
      - name: Publicar instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="apk-deudas-1.6-${GITHUB_RUN_NUMBER}"
          for publish_attempt in 1 2 3; do
            if ! gh release view "$release_tag" >/dev/null 2>&1; then
              gh release create "$release_tag" --target "$GITHUB_SHA" --title "GRAFIPLOT QR Deudas 1.6" --notes "Instalación independiente de QR Directo para evitar conflictos de firma. Acciones diferenciadas: Marcar pagado deja deuda cero. Pagado y retirar de pendientes marca recogido, conserva historial y libera QR. Desde la ficha QR: eliminar deuda marcándola pagada y editar total, pago o saldo. Sincronización con PC y actualización de notificaciones. Conserva cámara delantera/trasera, flash, recibos PDF y modo de segundo plano." || true
            fi
            if gh release upload "$release_tag" GRAFIPLOT_QR_Deudas_1_6.apk --clobber; then
              exit 0
            fi
            sleep 5
          done
          exit 1
