<!doctype html><html lang="es"><meta charset="utf-8"><title>GRAFIPLOT conexión QR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const client = supabase.createClient('https://gyvztqpvgtinxoqhyfbw.supabase.co','sb_publishable_m5tDCWoaiu-xP-lezwd3Lg_rlUfq118');
let queue=Promise.resolve();
window.enqueueQr=code=>{
 queue=queue.catch(()=>{}).then(async()=>{
  let codigo=String(code).trim();
  if(!/^\d{1,3}$/.test(codigo))return;
  codigo=String(parseInt(codigo,10)).padStart(3,'0');
  if(Number(codigo)<1||Number(codigo)>100)return;
  try{
   const {data:{session},error:authError}=await client.auth.getSession();
   if(authError)throw authError;
   if(!session?.user)throw new Error('Abre GRAFIPLOT e inicia sesión para enviar el QR a la PC.');
   const {error}=await client.from('grafiplot_qr_lecturas').insert({user_id:session.user.id,codigo});
   if(error)throw error;
   const {data:record,error:readError}=await client.from('pedidos_pendientes').select('nombre,descripcion,total,pago')
     .eq('user_id',session.user.id).eq('codigo',codigo).eq('estado','pendiente').maybeSingle();
   if(readError)throw readError;
   window.GrafiplotService?.postMessage(JSON.stringify({codigo,encontrado:!!record,...record}));
  }catch(error){window.GrafiplotService?.postMessage(JSON.stringify({codigo,error:error.message}));}
 });
};
</script></html>
